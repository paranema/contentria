# infra/secrets/<env>/contentria-backend-api.yaml로 복사한 뒤 값을 채운다.
apiVersion: v1
kind: Namespace
metadata:
  name: blog
---
apiVersion: v1
kind: Secret
metadata:
  name: contentria-backend-api
  namespace: blog
type: Opaque
stringData:
  # Database. database.yaml의 postgres-contentria와 같은 값
  DATABASE_USERNAME: "contentria"
  DATABASE_PASSWORD: ""

  # OAuth2
  SPRING_OAUTH_GOOGLE_CLIENT_ID: ""
  SPRING_OAUTH_GOOGLE_CLIENT_SECRET: ""

  # reCAPTCHA
  GOOGLE_RECAPTCHA_V2_SECRET_KEY: ""
  GOOGLE_RECAPTCHA_V3_SECRET_KEY: ""

  # JWT
  JWT_SECRET: ""

  # Mailgun
  MAILGUN_USERNAME: ""
  MAILGUN_PASSWORD: ""

  # Cloudflare R2 Storage
  R2_ACCESS_KEY_ID: ""
  R2_SECRET_ACCESS_KEY: ""
  R2_ENDPOINT: ""
  R2_BUCKET_NAME: ""
  R2_PUBLIC_URL: ""
