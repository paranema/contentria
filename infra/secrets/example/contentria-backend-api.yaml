# infra/secrets/<env>/contentria-backend-api.yaml로 복사한 뒤 값을 채운다.
# 전체 환경 변수 설명은 backend/apps/api/.env.sample 참고.
apiVersion: v1
kind: Namespace
metadata:
  name: contentria
---
apiVersion: v1
kind: Secret
metadata:
  name: contentria-backend-api
  namespace: contentria
type: Opaque
stringData:
  # database.yaml의 postgres-api-app password와 동일한 값
  DATABASE_PASSWORD: ""

  # 토큰 및 방문자 식별 해시 서명 키 (openssl rand -base64 32)
  MEMBER_ACCESS_TOKEN_SECRET: ""
  ANALYTICS_VISITOR_KEY_SECRET: ""

  # Google OAuth 2.0
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""

  # Google reCAPTCHA
  GOOGLE_RECAPTCHA_V3_SECRET_KEY: ""
  GOOGLE_RECAPTCHA_V2_SECRET_KEY: ""

  # SMTP 메일 발송 자격 증명
  SPRING_MAIL_USERNAME: ""
  SPRING_MAIL_PASSWORD: ""

  # Cloudflare R2 스토리지 (https://<계정 ID>.r2.cloudflarestorage.com)
  R2_ENDPOINT: ""
  R2_ACCESS_KEY_ID: ""
  R2_SECRET_ACCESS_KEY: ""
