# infra/secrets/<env>/contentria-backend-worker.yaml로 복사한 뒤 값을 채운다.
# 전체 환경 변수 설명은 backend/apps/worker/.env.sample 참고.
apiVersion: v1
kind: Namespace
metadata:
  name: contentria
---
apiVersion: v1
kind: Secret
metadata:
  name: contentria-backend-worker
  namespace: contentria
type: Opaque
stringData:
  # database.yaml의 postgres-worker-app password와 동일한 값
  DATABASE_PASSWORD: ""

  # Cloudflare R2 스토리지
  R2_ENDPOINT: ""
  R2_ACCESS_KEY_ID: ""
  R2_SECRET_ACCESS_KEY: ""

  # Cloudflare Queues (http_pull 소비자)
  CLOUDFLARE_ACCOUNT_ID: ""
  CF_QUEUE_ID: ""
  CF_API_TOKEN: ""
