# infra/secrets/<env>/contentria-backend-migrator.yaml로 복사한 뒤 값을 채운다.
# 각 비밀번호는 database.yaml의 해당 postgres-<컨텍스트>-migrator 시크릿 password와 동일해야 한다.
apiVersion: v1
kind: Namespace
metadata:
  name: contentria
---
apiVersion: v1
kind: Secret
metadata:
  name: contentria-backend-migrator
  namespace: contentria
type: Opaque
stringData:
  MEMBER_MIGRATOR_PASSWORD: ""
  PUBLISHING_MIGRATOR_PASSWORD: ""
  INTERACTION_MIGRATOR_PASSWORD: ""
  NOTIFICATION_MIGRATOR_PASSWORD: ""
  MEDIA_MIGRATOR_PASSWORD: ""
  ANALYTICS_MIGRATOR_PASSWORD: ""
