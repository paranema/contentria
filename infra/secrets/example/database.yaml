# infra/secrets/<env>/database.yaml로 복사한 뒤 password 값을 채운다.
# CloudNativePG managed.roles가 DB 계정의 비밀번호를 설정·동기화할 때 사용한다. username은 변경하지 않는다.
apiVersion: v1
kind: Namespace
metadata:
  name: database
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-member-migrator
  namespace: database
type: kubernetes.io/basic-auth
stringData:
  username: member_migrator
  password: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-publishing-migrator
  namespace: database
type: kubernetes.io/basic-auth
stringData:
  username: publishing_migrator
  password: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-interaction-migrator
  namespace: database
type: kubernetes.io/basic-auth
stringData:
  username: interaction_migrator
  password: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-notification-migrator
  namespace: database
type: kubernetes.io/basic-auth
stringData:
  username: notification_migrator
  password: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-media-migrator
  namespace: database
type: kubernetes.io/basic-auth
stringData:
  username: media_migrator
  password: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-analytics-migrator
  namespace: database
type: kubernetes.io/basic-auth
stringData:
  username: analytics_migrator
  password: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-api-app
  namespace: database
type: kubernetes.io/basic-auth
stringData:
  username: api_app
  password: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-batch-app
  namespace: database
type: kubernetes.io/basic-auth
stringData:
