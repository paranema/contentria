# infra/secrets/<env>/contentria-backend-batch.yaml로 복사한 뒤 값을 채운다.
apiVersion: v1
kind: Namespace
metadata:
  name: blog
---
apiVersion: v1
kind: Secret
metadata:
  name: contentria-backend-batch
  namespace: blog
type: Opaque
stringData:
  # Database. database.yaml의 postgres-contentria와 같은 값
  DATABASE_USERNAME: "contentria"
  DATABASE_PASSWORD: ""

  # Mailgun
  MAILGUN_USERNAME: ""
  MAILGUN_PASSWORD: ""
