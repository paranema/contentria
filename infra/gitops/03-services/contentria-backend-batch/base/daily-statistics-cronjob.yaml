apiVersion: batch/v1
kind: CronJob
metadata:
  name: contentria-backend-batch-daily-statistics
  labels:
    app: contentria-backend-batch
    job-type: daily-statistics
spec:
  schedule: "0 1 * * *"
  timeZone: "Asia/Seoul"

  # 이전 실행이 끝나지 않았으면 새 실행을 막는다.
  concurrencyPolicy: Forbid

  # 최근 성공 7개, 실패 3개 Job을 보관한다.
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3

  # 노드 장애 등으로 스케줄을 놓쳐도 10분 안이면 실행한다.
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      backoffLimit: 2

      # 1시간 안에 끝나지 않으면 강제 종료한다. targetDate는 기본값(어제, KST)을 쓴다.
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app: contentria-backend-batch
            job-type: daily-statistics
        spec:
          # 실패 원인을 남기기 위해 Never와 backoffLimit을 함께 쓴다.
          restartPolicy: Never

          containers:
            - name: contentria-backend-batch
              image: contentria/contentria-batch # 태그는 환경별 overlay에서 지정한다.
              imagePullPolicy: IfNotPresent

              # 실행할 Job 이름만 지정한다.
              args:
                - "--spring.batch.job.enabled=true"
                - "--spring.batch.job.name=dailyStatisticsJob"

              envFrom:
                - configMapRef:
                    name: contentria-backend-batch
                - secretRef:
                    name: contentria-backend-batch # infra/secrets로 수동 적용

              resources:
                requests:
                  memory: "512Mi"
                  cpu: "200m"
                limits:
                  memory: "1Gi"
                  cpu: "1000m"

              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault

              # readOnlyRootFilesystem을 쓰므로 JVM, Spring Boot가 쓰는 /tmp를 따로 마운트한다.
              volumeMounts:
                - name: tmp
                  mountPath: /tmp

          volumes:
            - name: tmp
              emptyDir: {}
