apiVersion: apps/v1
kind: Deployment
metadata:
  name: contentria-frontend-web
  labels:
    app: contentria-frontend-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: contentria-frontend-web
  template:
    metadata:
      labels:
        app: contentria-frontend-web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      containers:
        - name: contentria-frontend-web
          image: ghcr.io/paranema/contentria-frontend
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: contentria-frontend-web
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
