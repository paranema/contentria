apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: contentria

patches:
  - path: configmap-patch.yaml
  - path: httproute-patch.yaml

images:
  - name: ghcr.io/paranema/contentria-frontend
    newTag: latest

replicas:
  - name: contentria-frontend-web
    count: 1
