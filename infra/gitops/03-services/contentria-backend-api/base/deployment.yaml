apiVersion: apps/v1
kind: Deployment
metadata:
  name: contentria-backend-api
  labels:
    app: contentria-backend-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: contentria-backend-api
  template:
    metadata:
      labels:
        app: contentria-backend-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: contentria-backend-api
          image: ghcr.io/paranema/contentria-api
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: contentria-backend-api
            - secretRef:
                name: contentria-backend-api
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          # 현재 백엔드에는 별도 HTTP 헬스 엔드포인트가 없으므로 소켓 바인딩으로 기동 상태를 확인한다.
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
