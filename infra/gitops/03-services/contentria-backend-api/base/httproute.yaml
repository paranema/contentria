apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: contentria-backend-api
spec:
  parentRefs:
    - name: public
      namespace: envoy-gateway-system
      sectionName: https
  # hostnames는 환경별 overlay에서 지정한다.
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: contentria-backend-api
          port: 8080
