# 03-services/*/overlays/dev 폴더마다 Application을 하나씩 만든다.
# 앱 이름은 서비스 폴더명이다 (예: contentria-backend-api).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: services
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/seung7642/contentria.git
        revision: main
        directories:
          - path: infra/gitops/03-services/*/overlays/dev
  template:
    metadata:
      name: '{{ index .path.segments 3 }}'
    spec:
      project: default
      source:
        repoURL: https://github.com/seung7642/contentria.git
        targetRevision: main
        path: '{{ .path.path }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: blog
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
