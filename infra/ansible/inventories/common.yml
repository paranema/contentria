---
all:
  vars:
    # 홈 서버와 AWS가 공유하는 설정. 환경 인벤토리를 뒤에 지정해 덮어쓴다.
    ansible_become: true
    kube_version: 1.35.4
    container_manager: containerd
    kube_network_plugin: calico
    calico_network_backend: vxlan
    calico_ipip_mode: Never
    calico_vxlan_mode: Always
    kube_proxy_mode: iptables
    kube_service_addresses: 10.233.0.0/18
    kube_pods_subnet: 10.233.64.0/18
    # swap, sysctl, SELinux 등 Kubernetes 설정은 Kubespray가 관리한다.
    preinstall_selinux_state: permissive
    ntp_enabled: true
    helm_enabled: true
    argocd_enabled: false
    kube_vip_enabled: false
    loadbalancer_apiserver_localhost: true
    kubeconfig_localhost: false
    kubectl_localhost: false
    # 워크로드가 노드 자원을 모두 사용하지 않도록 kubelet에서 예약한다.
    kube_reserved: true
    kube_memory_reserved: 256Mi
    kube_cpu_reserved: 200m
    system_reserved: true
    system_memory_reserved: 256Mi
    system_cpu_reserved: 200m
