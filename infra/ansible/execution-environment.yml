---
version: 3
images:
  base_image:
    name: quay.io/rockylinux/rockylinux:9
dependencies:
  python_interpreter:
    package_system: python3.11
    python_path: /usr/bin/python3.11
  ansible_core:
    package_pip: ansible-core==2.18.12
  ansible_runner:
    package_pip: ansible-runner==2.4.1
  python: requirements.txt
  system: bindep.txt
additional_build_steps:
  append_base:
    - RUN $PKGMGR install -y python3.11-pip && $PKGMGR clean all
  append_final:
    - >-
      RUN git clone --depth 1 --branch v2.31.0 https://github.com/kubernetes-sigs/kubespray.git /opt/kubespray
      && test "$(git -C /opt/kubespray rev-parse HEAD)" = "1c9add48975060f45396b34d8e022c30d7f80dab"
options:
  # Docker Desktop/Colima의 호스트 마운트에 runner 산출물을 기록한다.
  user: "0"
  package_manager_path: /usr/bin/dnf
