---
# 두 노드용 단일 replica 구성. 서버는 ClusterIP로만 노출한다.
redis-ha:
  enabled: false
server:
  service:
    type: ClusterIP
configs:
  cm:
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = "Waiting for the child application"
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          hs.message = obj.status.health.message or ""
        end
        if obj.status.sync == nil or obj.status.sync.status ~= "Synced" then
          hs.status = "Progressing"
          hs.message = "Waiting for sync"
        end
      end
      return hs
  repositories:
    envoy-gateway:
      url: docker.io/envoyproxy
      type: helm
      enableOCI: "true"
