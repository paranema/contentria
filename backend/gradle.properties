# Kotlin Gradle 플러그인 2.4.10의 Build Tools API 경로는 Spring Boot 플러그인을 적용하지 않은
# 모듈(shared-kernel, <컨텍스트>-api)을 컴파일할 때 NullPointerException을 낸다.
# (CommonCompilerArguments.getPluginClasspaths()가 null)
# 이전 컴파일 경로를 쓴다. Kotlin을 올릴 때 이 줄을 지우고 ./gradlew clean build로 다시 확인한다.
kotlin.compiler.runViaBuildToolsApi=false
