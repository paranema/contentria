# apps/api를 로컬에서 띄울 때 필요한 의존. 운영과 테스트에는 쓰지 않는다.
# 미디어 저장소는 여기서 띄우지 않고 개발용 R2 버킷을 쓴다(README의 "로컬에서 api 띄우기").
# bootRun은 이 폴더에서 돌기 때문에 spring-boot-docker-compose가 이 파일을 찾아 docker compose up을 하고,
# 앱이 끝나면 stop한다. 컨테이너를 지우지 않으므로 데이터는 다음 실행에도 남는다.
# 처음부터 다시 만들려면: docker compose -f apps/api/compose.yaml down -v
#
# Boot는 띄우고 멈추기만 한다. 접속 정보는 앱이 평소처럼 환경 변수로 받는다(.env.sample에 이 파일의 값을 적었다).
# 호스트 포트는 기본 포트에 10000을 더한 값이다. 다른 로컬 스택의 PostgreSQL, Kafka와 겹치지 않게 한다.
# 모두 127.0.0.1에만 열어 이 머신 밖에서는 붙을 수 없다.
name: contentria-api

services:
  # 운영과 같은 롤과 스키마로 만든다(infra/database/contentria-v2). 앱은 슈퍼유저가 아니라 api_app으로 붙는다.
  # Boot가 슈퍼유저로 연결을 바꿔 끼우지 않도록 이 서비스는 연결 대상에서 뺀다.
  # 비밀번호 없이 받는다(trust). 롤의 권한은 그대로라 api_app은 DML만 한다. 이 머신에서만 붙도록 루프백에만 연다.
  postgres:
    image: postgres:17
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../../infra/database/contentria-v2:/contentria-v2:ro
      - ./compose/postgres-init.sh:/docker-entrypoint-initdb.d/postgres-init.sh:ro
    labels:
      org.springframework.boot.ignore: "true"
    healthcheck:
      # 초기화 중의 임시 서버는 소켓으로만 받으므로, TCP로 확인해야 초기화가 끝난 뒤에 통과한다.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-d", "contentria_v2"]
      interval: 2s
      retries: 30

  # apps/migrator와 같은 방식: 컨텍스트마다 그 컨텍스트의 마이그레이션 롤로 Flyway를 돌린다.
  # 작업 중인 소스의 마이그레이션 파일을 그대로 읽고, 띄울 때마다 새 마이그레이션을 반영한다.
  # 버전은 Boot가 관리하는 flyway-core에 맞춘다.
  migrate:
    image: flyway/flyway:12.4.0
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["sh", "/migrate.sh"]
    environment:
      REDGATE_DISABLE_TELEMETRY: "true"
    volumes:
      - ./compose/migrate.sh:/migrate.sh:ro
      - ../../contexts/member/member-core/src/main/resources/db/migration/member:/migrations/member:ro
      - ../../contexts/publishing/publishing-core/src/main/resources/db/migration/publishing:/migrations/publishing:ro
      - ../../contexts/interaction/interaction-core/src/main/resources/db/migration/interaction:/migrations/interaction:ro
      - ../../contexts/notification/notification-core/src/main/resources/db/migration/notification:/migrations/notification:ro
      - ../../contexts/media/media-core/src/main/resources/db/migration/media:/migrations/media:ro
      - ../../contexts/analytics/analytics-core/src/main/resources/db/migration/analytics:/migrations/analytics:ro
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/done"]
      interval: 2s
      retries: 90

  # 단일 노드(브로커 겸 컨트롤러). 클라이언트에 알려 주는 주소가 호스트 포트와 같아야 앱이 붙는다.
  # Boot에는 compose의 Kafka를 연결해 주는 기능이 없어서, 앱은 KAFKA_BOOTSTRAP_SERVERS로 이 주소를 받는다.
  # KAFKA_ 변수를 하나라도 주면 이미지가 기본 설정을 쓰지 않으므로 전부 적는다.
  kafka:
    image: apache/kafka:4.1.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:19092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "127.0.0.1:19092:9092"

volumes:
  postgres-data:
