server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: contentria-api

  # The new structure's database, not the legacy `contentria` one (docs/architecture/04-persistence-conventions.md).
  # api_app has DML on the context schemas and no DDL; apps/migrator applies the schema.
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/contentria_v2}
    username: ${DATABASE_USERNAME:api_app}
    password: ${DATABASE_PASSWORD}

  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate only checks at start-up that the entities match it.
      ddl-auto: validate
    # Releases the connection when the transaction ends instead of holding it for the whole
    # request. Lazy associations must therefore be resolved inside the service layer.
    open-in-view: false
    show-sql: false
    properties.hibernate:
      format_sql: true
      default_batch_fetch_size: 100
      jdbc.batch_size: 100
      order_inserts: true
      order_updates: true

logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG
