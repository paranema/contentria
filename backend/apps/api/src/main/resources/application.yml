server:
  port: 8080
  servlet:
    context-path: /api
  # The API sits behind the gateway and, for the web's server-side calls, behind Next.js. The
  # client's address comes from X-Forwarded-For, which Tomcat honours only when the request itself
  # comes from a private address (a proxy of ours); anyone else's header is ignored. Analytics
  # keys visitors by this address (docs/contexts/analytics/02-implementation.md).
  forward-headers-strategy: native

spring:
  application:
    name: contentria-api

  # The new structure's database, not the legacy `contentria` one (docs/architecture/04-persistence-conventions.md).
  # api_app has DML on the context schemas and no DDL; apps/migrator applies the schema.
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/contentria_v2}
    username: ${DATABASE_USERNAME:api_app}
    password: ${DATABASE_PASSWORD}

  # Google only for now (docs/contexts/member/01-rules.md, 확인 필요). Boot fills in Google's
  # endpoints. The redirect URI must match one registered with Google; behind a proxy, set it
  # explicitly instead of letting {baseUrl} come from the request.
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,email
            redirect-uri: ${GOOGLE_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}

  # Events between contexts (docs/architecture/03-context-integration.md, 이벤트). Keys and values
  # are strings: the key is the aggregate id, the value the JSON envelope.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      # The relay marks an event sent only once every in-sync replica has it.
      acks: all
    consumer:
      # A new consumer group starts from the oldest event it can still read, so none is missed.
      auto-offset-reset: earliest

  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate only checks at start-up that the entities match it.
      ddl-auto: validate
    # Releases the connection when the transaction ends instead of holding it for the whole
    # request. Lazy associations must therefore be resolved inside the service layer.
    open-in-view: false
    show-sql: false
    properties.hibernate:
      format_sql: true
      default_batch_fetch_size: 100
      jdbc.batch_size: 100
      order_inserts: true
      order_updates: true

logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG

contentria:
  # Readers' visits (docs/contexts/analytics). The secret keys the visitor hash; no default.
  analytics:
    visitor-key-secret: ${ANALYTICS_VISITOR_KEY_SECRET}
  # Images for post bodies (docs/contexts/media). The bucket is Cloudflare R2 over its S3 API; the
  # browser puts files to it directly, and the public domain serves them.
  media:
    public-base-url: ${MEDIA_PUBLIC_BASE_URL}
    upload-url-ttl: 10m
    storage:
      endpoint: ${R2_ENDPOINT}
      bucket: ${R2_BUCKET_NAME}
      region: auto
      access-key-id: ${R2_ACCESS_KEY_ID}
      secret-access-key: ${R2_SECRET_ACCESS_KEY}
  member:
    access-token:
      # Base64-encoded key of at least 256 bits. No default: the app must not start without one.
      secret: ${MEMBER_ACCESS_TOKEN_SECRET}
      ttl: 15m
    refresh-token-ttl: 7d
    cookie:
      secure: ${MEMBER_COOKIE_SECURE:true}
    # Asked before sign-up, login and anything that mails a code or link (docs/contexts/member/01-rules.md,
    # 사람 확인). off only for local development; with google, both secrets must be set.
    recaptcha:
      mode: ${MEMBER_RECAPTCHA_MODE:google}
      v3-secret-key: ${GOOGLE_RECAPTCHA_V3_SECRET_KEY:}
      v2-secret-key: ${GOOGLE_RECAPTCHA_V2_SECRET_KEY:}
      minimum-score: ${MEMBER_RECAPTCHA_MINIMUM_SCORE:0.5}
    mail:
      # smtp in every deployed environment. log writes codes to the log and is for local use only.
      mode: ${MEMBER_MAIL_MODE:smtp}
      from: ${MEMBER_MAIL_FROM:no-reply@contentria.com}
    # The frontend page that reads #token= from a password setup or reset link.
    password:
      link-url: ${MEMBER_PASSWORD_LINK_URL:http://localhost:3000/password}
    # Where the browser lands after a social sign-in or link. Never taken from the request.
    social:
      login-success-url: ${MEMBER_SOCIAL_LOGIN_SUCCESS_URL:http://localhost:3000/login/callback}
      login-failure-url: ${MEMBER_SOCIAL_LOGIN_FAILURE_URL:http://localhost:3000/login}
      link-result-url: ${MEMBER_SOCIAL_LINK_RESULT_URL:http://localhost:3000/dashboard/settings}
